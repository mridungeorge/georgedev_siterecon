name: CI

# The deploy workflow runs only after this one succeeds on a push to master, so everything that must
# pass before a deploy is a step here: types, lint, tests, the build, and the accuracy and
# adversarial gates (the same idea as RepoRecon's eval gate).
on:
  push:
    branches: [master]
  pull_request: {}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # typecheck generates Next's route and layout types first: LayoutProps does not exist until it does
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Accuracy on the fixture sites
        run: npm run eval
      - name: Adversarial cases
        run: npm run eval:adversarial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecards
          path: |
            eval/scorecard.json
            eval/adversarial-scorecard.json
      - run: npm run build

  fetch-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fetch-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetch-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
